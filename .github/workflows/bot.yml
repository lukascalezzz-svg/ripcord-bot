name: tests
# The live desk runs on Supabase (pg_cron every 15 s -> edge function ripcord-tick).
# GitHub only checks the agent logic on every push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test bot/test.mjs
